<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login | Bangladesh Phytopathological Society</title>
<meta name="description" content="BPS member login portal — access member directory, publications and exclusive resources.">
<meta name="author" content="Bangladesh Phytopathological Society">
<link rel="canonical" href="https://www.bps.net.bd/pages/member-login.html">
<link rel="icon" href="../assets/images/logo/bps-logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<link href="../assets/css/responsive.css" rel="stylesheet">
<link href="../assets/css/animations.css" rel="stylesheet">
</head>
<body data-page="membership">

<div data-include="header.html"></div>

<header class="page-header">
  <div class="container">
    <ul class="breadcrumb-nav"><li><a href="../index.html">Home</a></li><li><a href="membership.html">Membership</a></li><li class="active">Member Login</li></ul>
    <h1>Member Login</h1>
    <p class="text-white-50 mb-0">Access your BPS member dashboard, directory and exclusive resources.</p>
  </div>
</header>

<section class="section-pad">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 reveal">
        <div class="contact-form-box">
          <div class="text-center mb-4">
            <img src="../assets/images/logo/bps-logo.svg" alt="BPS Logo" width="64" height="64">
            <h4 class="mt-3 mb-0">Welcome Back</h4>
            <p class="text-muted small">Log in to your BPS member account</p>
          </div>
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Email Address *</label>
              <input type="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password *</label>
              <input type="password" class="form-control" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label small" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="small">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary-c w-100">Log In <i class="bi bi-box-arrow-in-right"></i></button>
            <div id="loginFormMsg" class="mt-3"></div>
          </form>
          <hr class="my-4">
          <p class="text-center small text-muted mb-0">Not a member yet? <a href="membership.html">Apply for membership</a></p>
        </div>
      </div>
    </div>
  </div>
</section>

<div data-include="footer.html"></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/forms.js"></script>
</body>
</html>
