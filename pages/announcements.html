<!DOCTYPE html>
<html lang="en" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements | Bangladesh Phytopathological Society</title>
<meta name="description" content="Official announcements from the Bangladesh Phytopathological Society regarding membership, publications and events.">
<meta name="author" content="Bangladesh Phytopathological Society">
<link rel="canonical" href="https://www.bps.net.bd/pages/announcements.html">
<link rel="icon" href="../assets/images/logo/bps-logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="../assets/css/style.css" rel="stylesheet">
<link href="../assets/css/responsive.css" rel="stylesheet">
<link href="../assets/css/animations.css" rel="stylesheet">
</head>
<body data-page="news">

<div data-include="header.html"></div>

<header class="page-header">
  <div class="container">
    <ul class="breadcrumb-nav">
      <li><a href="../index.html">Home</a></li>
      <li><a href="news.html">News &amp; Media</a></li>
      <li class="active">Announcements</li>
    </ul>
    <h1>Announcements</h1>
    <p class="text-white-50 mb-0">Official notices from BPS Administration.</p>
  </div>
</header>

<section class="section-pad">
  <div class="container">
    <div class="row g-5">
      <div class="col-lg-8">
        <div class="notice-demo reveal"><i class="bi bi-info-circle-fill"></i><div>Sample announcements shown below for demonstration.</div></div>
        <div class="row g-4" id="announcementsGrid"></div>
      </div>
      <div class="col-lg-4">
        <div class="sidebar-widget">
          <h6>Related</h6>
          <ul>
            <li><a href="news.html">Latest News <i class="bi bi-arrow-right"></i></a></li>
            <li><a href="events.html">Upcoming Events <i class="bi bi-arrow-right"></i></a></li>
            <li><a href="../index.html#newsletter">Newsletter Signup <i class="bi bi-arrow-right"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="newsModal" tabindex="-1" aria-labelledby="newsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="newsModalLabel">Announcement</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" id="newsModalBody"></div>
      </div>
    </div>
  </div>
</section>

<div data-include="footer.html"></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/filters.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  window.BPS.fetchJSON('news.json').then((data) => {
    const list = data.filter((n) => n.category === 'Announcement');
    window.__newsData = data;
    const grid = document.getElementById('announcementsGrid');
    grid.innerHTML = list.length ? list.map((n) => `
      <div class="col-md-6 reveal">
        <div class="card-base news-card">
          <img src="../assets/images/news/news-${n.id}.webp" class="img-cover" alt="${n.title}" loading="lazy">
          <div class="card-body-pad">
            <div class="news-meta"><span class="badge-soft">${n.category}</span><span>${n.date}</span></div>
            <h5>${n.title}</h5>
            <p class="text-muted small">${n.excerpt}</p>
            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#newsModal" data-news-id="${n.id}">Read More <i class="bi bi-arrow-right"></i></button>
          </div>
        </div>
      </div>`).join('') : '<p class="text-muted">No announcements found.</p>';
    document.dispatchEvent(new CustomEvent('bps:contentRendered'));
  });
  document.body.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-news-id]');
    if (!btn) return;
    const n = (window.__newsData || []).find((x) => x.id == btn.getAttribute('data-news-id'));
    if (n) {
      document.getElementById('newsModalLabel').textContent = n.title;
      document.getElementById('newsModalBody').innerHTML = `<img src="../assets/images/news/news-${n.id}.webp" class="img-cover rounded mb-3" style="height:220px" alt="${n.title}"><div class="news-meta mb-2"><span class="badge-soft">${n.category}</span><span>${n.date}</span></div><p>${n.excerpt}</p><p>${n.content}</p>`;
    }
  });
});
</script>
</body>
</html>
